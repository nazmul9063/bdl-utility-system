
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDL Utility & Task Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f7fa;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 10;
      font-family: Arial, sans-serif;
      color: #2563eb;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div style="text-align:center">
      <div class="spinner"></div>
      <p>Loading BDL Utility System...</p>
    </div>
  </div>

  <iframe
    id="appFrame"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const APP_URL =
      "https://script.google.com/macros/s/AKfycby0XZKrSx5_aY0kmYdM6c-1Sid6NAFuD0TnfCVq3Q7fLke0DJSKDw4yek5_ld3ZLBuQ/exec";

    const params = new URLSearchParams(
      window.location.search
    );

    const appURL = new URL(APP_URL);

    appURL.searchParams.set("embedded", "true");

    const page = params.get("page");
    const user = params.get("user");

    if (page) {
      appURL.searchParams.set("page", page);
    }

    if (user) {
      appURL.searchParams.set("user", user);
    }

    const frame = document.getElementById("appFrame");

    frame.onload = function() {
      document.getElementById("loading").style.display = "none";
    };

    frame.src = appURL.toString();
  </script>

</body>
</html>
